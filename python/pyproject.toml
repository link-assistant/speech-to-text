[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text"
version = "0.1.0"
description = "Speech-to-text transcription library and CLI tool with multiple AI provider support"
readme = "../README.md"
requires-python = ">=3.9"
license = {text = "Unlicense"}
authors = [
    { name = "link-assistant" }
]
keywords = [
    "speech-to-text",
    "transcription",
    "whisper",
    "openai",
    "groq",
    "huggingface",
    "audio",
    "cli",
    "server",
    "rest-api",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "aiohttp>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
groq = ["groq>=0.4.0"]
all = [
    "speech-to-text[openai,groq]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.scripts]
speech-to-text = "speech_to_text.cli:main"

[project.urls]
Homepage = "https://github.com/link-assistant/speech-to-text"
Repository = "https://github.com/link-assistant/speech-to-text"
Issues = "https://github.com/link-assistant/speech-to-text/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["speech_to_text*"]
